apiVersion: apps/v1
kind: Deployment
metadata:
  name: jiaxicao-deepseek-reasoning-keepalive
  namespace: sn5-system-intern
  labels:
    app: jiaxicao-deepseek-reasoning-keepalive
    owner: jiaxicao
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: jiaxicao-deepseek-reasoning-keepalive
  template:
    metadata:
      labels:
        app: jiaxicao-deepseek-reasoning-keepalive
        owner: jiaxicao
    spec:
      terminationGracePeriodSeconds: 10
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.kubernetes.io/instance-type
                    operator: NotIn
                    values:
                      - ml.p5e.48xlarge
      containers:
        - name: keepalive
          image: public.ecr.aws/docker/library/python:3.11-slim
          imagePullPolicy: IfNotPresent
          command: ["python", "-u"]
          args:
            - /mnt/sn-007/jiaxicao/code/slime/.worktrees/cc-ags-swe/examples/claudecode_ags/deepseek_reasoning_keepalive.py
          env:
            - name: SLIME_REMOTE_OPENAI_BASE_URL
              value: https://ms-bg7s6hs9-100034032793-sw.gw.ap-zhongwei.ti.tencentcs.com/ms-bg7s6hs9
            - name: SLIME_REMOTE_OPENAI_MODEL
              value: DeepSeek-V4-Flash-0731
            - name: SLIME_REASONING_KEEPALIVE_ENV_FILE
              value: /mnt/sn-007/jiaxicao/code/slime/.worktrees/cc-ags-swe/examples/claudecode_ags/env/slime_ags.env
            - name: SLIME_REASONING_KEEPALIVE_INFLIGHT
              value: "4"
            - name: SLIME_REASONING_KEEPALIVE_MAX_TOKENS
              value: "16384"
            - name: SLIME_REASONING_KEEPALIVE_TIMEOUT_SEC
              value: "1800"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: fsx-storage
              mountPath: /mnt/sn-007
      volumes:
        - name: fsx-storage
          persistentVolumeClaim:
            claimName: youtu-sn2-007
