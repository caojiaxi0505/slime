# Path A GRPO 1-node debug: internet-facing ALB -> Service -> Master pod :9002
#
# Mirrors slime-tencent/yaml/cc-ags-recorder-alb.yaml and existing
# qwen35-9b-swe-rl-grpo-adapter Ingress in sn5-system-intern.
#
# Selector pins ONLY the training Master (Worker must NOT carry these labels):
#   app=cc-ags-recorder
#   workload=jiaxicao-grpo-1node-debug
#
# Sequence:
#   bash examples/claudecode_ags/launch/grpo_adapter_alb/submit_alb.sh
#   # wait for ADDRESS, then:
#   export SLIME_ADAPTER_PUBLIC_URL=http://<ADDRESS>
# Teardown:
#   bash examples/claudecode_ags/launch/grpo_adapter_alb/submit_alb.sh --delete
#
# NOTE: ALB targets stay UNHEALTHY until the Master pod is Running and the
# in-process adapter listens on :9002 (after Ray/train.py start). Expected.
---
apiVersion: v1
kind: Service
metadata:
  name: jiaxicao-grpo-1node-debug-adapter
  namespace: sn5-system-intern
  labels:
    app: cc-ags-recorder
    workload: jiaxicao-grpo-1node-debug
    owner: jiaxicao
spec:
  selector:
    app: cc-ags-recorder
    workload: jiaxicao-grpo-1node-debug
  ports:
    - name: http
      port: 9002
      targetPort: 9002
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jiaxicao-grpo-1node-debug-adapter
  namespace: sn5-system-intern
  labels:
    app: cc-ags-recorder
    workload: jiaxicao-grpo-1node-debug
    owner: jiaxicao
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "10"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    # long CC turns / SGLang generation must not be cut by the 60s default idle
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=3600
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jiaxicao-grpo-1node-debug-adapter
                port:
                  number: 9002
